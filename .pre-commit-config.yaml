# Install once with `uv run pre-commit install`. Run everything with `uv run pre-commit run --all-files`.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
# Licence texts and vendored upstream assets are kept byte-for-byte as published; never let a fixer touch them
# (this also exempts the SO-101 meshes, up to 2.7 MB each, from the 1 MB large-file guard).
exclude: ^(LICENSE|LICENSE-CONTENT|LICENSES/.*|packages/benchtop-sim/src/benchtop_sim/assets/robotstudio_so101/(?!UPSTREAM\.md$).*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Uses the project environment so mypy sees the same dependencies and config as the gate.
      - id: mypy
        name: mypy (strict, uv run)
        entry: uv run mypy
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
      - id: lint-imports
        name: import-linter contracts (uv run)
        entry: uv run lint-imports
        language: system
        types_or: [python, toml]
        pass_filenames: false

  # Lints .github/workflows (expressions, job graph, and embedded shell through shellcheck when it is on PATH).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # REUSE (GPL-3.0-or-later) runs only as an isolated external tool, never as a project dependency (ADR-010).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
