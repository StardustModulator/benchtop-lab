# SPDX-License-Identifier: Apache-2.0
#
# Docs site: Material for MkDocs 9.x on MkDocs 1.x (ADR-009). Build with `uv run mkdocs build --strict`.
# Design system: .claude/skills/ui-excellence (tokens in docs/assets/stylesheets/tokens.css).
# House rules checked by tests/test_docs_site.py and tools/check_site.py: no analytics, no cookies, no fonts or
# scripts from a CDN at runtime (ADR-001). The privacy plugin downloads Mermaid and KaTeX at build time and
# serves them from this site.
site_name: Benchtop Lab
site_description: >-
  Graded, sim-first robot-learning projects for the SO-101 arm, built on LeRobot and MuJoCo.
  Free and open source.
site_url: https://stardustmodulator.github.io/benchtop-lab/
site_author: Benchtop Lab contributors
repo_url: https://github.com/StardustModulator/benchtop-lab
repo_name: StardustModulator/benchtop-lab
edit_uri: edit/main/docs/
copyright: >-
  Text and figures © 2026 Benchtop Lab contributors, licensed
  <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC&nbsp;BY&nbsp;4.0</a>.
  Code licensed
  <a href="https://www.apache.org/licenses/LICENSE-2.0" rel="license">Apache-2.0</a>.

docs_dir: docs
site_dir: site
strict: false # the gate passes --strict explicitly; `mkdocs serve` stays forgiving while writing
# Provenance records for vendored assets live beside the files; they are not pages.
exclude_docs: |
  /assets/**/*.md

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false # self-hosted fonts only (docs/assets/stylesheets/fonts.css); never Google Fonts
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/file-code-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Theme: follows your system. Switch to light"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Theme: light. Switch to dark"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Theme: dark. Switch to follow your system"
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/tokens.css
  - assets/stylesheets/theme.css
  # Build-time source only: the privacy plugin copies KaTeX and its fonts into the site.
  - https://unpkg.com/katex@0.19.1/dist/katex.min.css

extra_javascript:
  - https://unpkg.com/katex@0.19.1/dist/katex.min.js
  - assets/javascripts/math.js

hooks:
  - tools/docs_hooks.py

plugins:
  - search:
      lang: en
  - privacy:
      assets: true
      assets_fetch: true
      assets_fetch_dir: assets/external
      cache_dir: .cache/mkdocs-privacy
      links: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/benchtop-core/src
            - packages/benchtop-sim/src
            - packages/benchtop-grade/src
            - packages/benchtop-data/src
            - packages/benchtop-real/src
            - packages/benchtop-lab/src
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Start here:
      - start/index.md
      - Install from source: start/install.md
      - SO-101 conventions: start/conventions.md
  - Projects:
      - projects/index.md
  - Concepts:
      - concepts/index.md
      - Wilson score interval: concepts/wilson-interval.md
  - Guides:
      - guides/index.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Python API:
          - reference/api/index.md
          - benchtop_core: reference/api/benchtop_core.md
          - benchtop_sim: reference/api/benchtop_sim.md
          - benchtop_grade: reference/api/benchtop_grade.md
          - benchtop_data: reference/api/benchtop_data.md
          - benchtop_real: reference/api/benchtop_real.md
          - benchtop_lab: reference/api/benchtop_lab.md
  - Contributing:
      - contributing/index.md
      - Writing docs: contributing/writing-docs.md
      - Releasing: contributing/releasing.md
  - Project:
      - project/index.md
      - Plan: PLAN.md
      - Architecture: ARCHITECTURE.md
      - Milestones: MILESTONES.md
      - Decisions: DECISIONS.md
      - Progress: PROGRESS.md
      - Changelog: project/changelog.md
