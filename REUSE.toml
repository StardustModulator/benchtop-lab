# SPDX-FileCopyrightText: 2026 Benchtop Lab contributors
# SPDX-License-Identifier: Apache-2.0
#
# Licensing for files that cannot carry an SPDX header (lockfiles, JSON, notebooks, generated files) and the
# defaults for everything else. A header inside a file always wins ("closest" precedence). ADR-003: code is
# Apache-2.0; lessons, docs, figures and other prose are CC-BY-4.0. Vendored assets get their own annotation
# with their upstream licence, and are listed in NOTICE.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Benchtop Lab contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.md", "**/*.ipynb", "docs/**", "projects/**/lesson/**", "NOTICE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Benchtop Lab contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Vendored, unmodified: MuJoCo Menagerie's SO-101 model (see UPSTREAM.md next to it, and NOTICE). Listed last so
# it wins over the Markdown rule above for upstream's README and CHANGELOG; our UPSTREAM.md carries its own header.
[[annotations]]
path = "packages/benchtop-sim/src/benchtop_sim/assets/robotstudio_so101/**"
precedence = "closest"
SPDX-FileCopyrightText = "TheRobotStudio and The MuJoCo Menagerie Authors"
SPDX-License-Identifier = "Apache-2.0"
