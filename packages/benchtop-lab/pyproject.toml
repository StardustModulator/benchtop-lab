[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchtop-lab"
dynamic = ["version"]
description = "Benchtop Lab: graded, sim-first robot-learning projects for the SO-101 arm (meta-package and `benchtop` CLI)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benchtop Lab contributors" }]
keywords = ["robotics", "lerobot", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "benchtop-core",
    "benchtop-sim",
    "benchtop-grade",
    "benchtop-data",
    "benchtop-real",
    "mujoco>=4.0,<5",
    "rich>=13.9",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/StardustModulator/benchtop-lab"
Source = "https://github.com/StardustModulator/benchtop-lab/tree/main/packages/benchtop-lab"
Issues = "https://github.com/StardustModulator/benchtop-lab/issues"

[project.scripts]
benchtop = "benchtop_lab.cli:main"

[tool.hatch.version]
path = "src/benchtop_lab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtop_lab"]
