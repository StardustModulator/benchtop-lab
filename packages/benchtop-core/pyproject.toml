[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchtop-core"
dynamic = ["version"]
description = "Compat layer (the only LeRobot import surface), shared models, logging and paths for Benchtop Lab."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benchtop Lab contributors" }]
keywords = ["robotics", "lerobot"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/StardustModulator/benchtop-lab"
Source = "https://github.com/StardustModulator/benchtop-lab/tree/main/packages/benchtop-core"
Issues = "https://github.com/StardustModulator/benchtop-lab/issues"

[project.optional-dependencies]
# PyTorch wheel flavour (PLAN §11). Pick at most one: `uv sync --extra cpu` or `uv sync --extra cu`.
cpu = ["torch>=2.7"]
cu = ["torch>=2.7"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu" },
]

[tool.hatch.version]
path = "src/benchtop_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtop_core"]
