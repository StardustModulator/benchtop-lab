[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchtop-real"
dynamic = ["version"]
description = "Hardware tools for the SO-101: calibration check and real-arm evaluation protocol."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benchtop Lab contributors" }]
keywords = ["robotics", "hardware"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "benchtop-core",
    "benchtop-sim",
]

[project.urls]
Homepage = "https://github.com/StardustModulator/benchtop-lab"
Source = "https://github.com/StardustModulator/benchtop-lab/tree/main/packages/benchtop-real"
Issues = "https://github.com/StardustModulator/benchtop-lab/issues"

[tool.hatch.version]
path = "src/benchtop_real/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtop_real"]
