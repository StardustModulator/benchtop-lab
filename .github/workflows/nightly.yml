#
# Nightly platform matrix (PLAN §12): the fast and slow suites on Linux and macOS (arm64), Python 3.12 and 3.13.
# Skeleton for now; later sessions add the full golden runs, the end-to-end integration test, link checks,
# throughput benchmarks and the LeRobot upstream canary here.
name: Nightly

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
  # Changes to the nightly setup are proven on the pull request that makes them.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/actions/setup/**

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  platform:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    # Scheduled runs belong to the main repository only; forks can still start one by hand.
    if: github.event_name != 'schedule' || github.repository == 'StardustModulator/benchtop-lab'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fast tests with the coverage gate (85%)
        run: make test
      - name: Tests marked slow
        run: make test-slow
